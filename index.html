<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг контрагентов - Checko</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Мониторинг контрагентов Checko</h1>

        <section class="panel" id="api-panel">
            <h2>API-ключ</h2>
            <label for="apiKey">Личный ключ Checko</label>
            <div class="row">
                <input id="apiKey" type="password" autocomplete="off" placeholder="Вставьте ключ Checko API">
                <button type="button" onclick="saveApiKey()">Сохранить</button>
            </div>
            <div class="note" id="apiStatus"></div>
        </section>

        <section class="panel" id="quick-form">
            <h2>Быстрая проверка</h2>
            <label for="quickInn">ИНН организации или ИП</label>
            <div class="row">
                <input id="quickInn" type="text" inputmode="numeric" maxlength="12" placeholder="10 или 12 цифр">
                <button type="button" onclick="runQuickCheck()">Проверить</button>
                <button type="button" class="secondary" onclick="window.print()">PDF</button>
            </div>
            <div class="status" id="quickStatus"></div>
        </section>

        <section class="panel" id="quickResult" style="display: none;"></section>

        <section class="panel" id="portfolio-panel">
            <h2>Портфель ИНН</h2>
            <label for="innList">Список ИНН</label>
            <textarea id="innList" placeholder="Вставьте список ИНН из письма, Excel или CRM"></textarea>

            <div class="row" style="margin-top: 12px;">
                <label>
                    Интервал проверки, дней
                    <input id="intervalDays" type="number" min="1" max="30" value="1">
                </label>
                <label>
                    Лимит запросов в запуске
                    <input id="requestLimit" type="number" min="1" max="100" value="100">
                </label>
            </div>

            <div class="checks">
                <label><input id="dueOnly" type="checkbox" checked> Только самые старые</label>
                <label><input id="useFinances" type="checkbox" checked> Финансы</label>
                <label><input id="useEnforcements" type="checkbox" checked> ФССП</label>
                <label><input id="useBankruptcy" type="checkbox" checked> Банкротства</label>
                <label><input id="useLegalCases" type="checkbox"> Арбитраж</label>
            </div>

            <div class="toolbar">
                <button type="button" onclick="addInns()">Добавить ИНН</button>
                <button type="button" onclick="runPortfolioBatch()">Проверить пачку</button>
                <button type="button" class="secondary" onclick="exportCsv()">CSV</button>
                <button type="button" class="secondary" onclick="exportJson()">JSON</button>
                <label class="file-button secondary">
                    Импорт JSON
                    <input type="file" accept="application/json" style="display: none;" onchange="importJson(event)">
                </label>
                <button type="button" class="danger" onclick="clearPortfolio()">Очистить</button>
            </div>

            <div class="status" id="portfolioStatus"></div>
            <div class="progress" id="progress"><div id="progressFill"></div></div>
            <div id="portfolioSummary"></div>
            <div id="portfolioTable"></div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
